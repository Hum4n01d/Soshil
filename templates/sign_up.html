{% extends 'layout.html' %}
{% from 'macros.html' import render_field, github_login %}

{% block body %}
<div class="login-title">
    <h1>Sign up</h1>
    {{ github_login() }}
</div>
<div id="signup-form">
    <form method='POST' action=''>
        {{ form.hidden_tag() }}
        {% for field in form %}
        {{ render_field(field) }}
        {% endfor %}
        <button type="submit">Sign up!</button>
    </form>
</div>
{% endblock %}
