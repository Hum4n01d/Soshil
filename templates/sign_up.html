{% extends 'layout.html' %}
{% from 'macros.html' import render_field %}

{% block body %}
<div class="login-title">
    <h1>Sign up</h1>
    <button><a href="{{ url_for('login_github')}}">Log in with GitHub<img src="/static/github-logo.svg" alt="Github's logo"></a></button>
</div>
<div id="signup-form">
    <form method='POST' action=''>
        {{ form.hidden_tag() }}
        {% for field in form %}
        {{ render_field(field) }}
        {% endfor %}
        <button type="submit">Sign up!</button>
    </form>
</div>
{% endblock %}
