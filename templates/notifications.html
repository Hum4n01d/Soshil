{% extends 'layout.html' %}

{% block body %}
{% if notifications %}
<ul class="notifications">
    {% for notification in notifications %}
    <li class="notification">
        <p>{{ notification.title|markdown }}</p>
        <span class="x-margin">-</span>
        <a href="{{ notification.link }}">View</a>
    </li>
    {% endfor %}
</ul>
{% else %}
<p>No notifications</p>
{% endif %}
{% endblock %}
