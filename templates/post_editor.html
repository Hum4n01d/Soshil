{% extends 'layout.html' %}
{% from 'macros.html' import render_field %}

{% block body %}
{% if edit %}
<h1>Edit Post:</h1>
{% elif comment %}
<h1>Edit Comment</h1>
{% else %}
<h1>New Post:</h1>
{% endif %}
<div class="post-editor">
    <form method='POST' action=''>
        {{ form.hidden_tag() }}
        {% for field in form %}
        {{ render_field(field) }}
        {% endfor %}
        <button type="submit">
            {% if edit %}
            Save!
            {% else %}
            Post!
            {% endif %}
        </button>
    </form>
</div>
{% endblock %}
