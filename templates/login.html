{% extends 'layout.html' %}
{% from 'macros.html' import render_field %}

{% block body %}
<h1>Login</h1>
<button><a href="{{ url_for('login_github')}}">Log in with GitHub<img src="/static/github-logo.svg" alt="Github's logo"></a></button>
<span class="x-margins">or</span>
<button class="modal-trigger">Log in with your Soshil account</button>
<div class="modal" id="login-form">
    <form method='POST' action=''>
        {{ form.hidden_tag() }}
        {% for field in form %}
        {{ render_field(field) }}
        {% endfor %}
        <button type="submit">Log in!</button>
    </form>
</div>
{% endblock %}
