{% extends 'layout.html' %}
{% from 'macros.html' import render_field %}

{% block body %}
<h1>Login</h1>
<a href="{{ url_for('login_github')}}">Login with GitHub<img src="/static/github-logo.svg" alt="Github's logo"></a>
<form method='POST' action=''>
    {{ form.hidden_tag() }}
    {% for field in form %}
    {{ render_field(field) }}
    {% endfor %}
    <button type="submit">Login!</button>
</form>
{% endblock %}
