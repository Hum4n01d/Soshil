{% extends 'layout.html' %}
{% from 'macros.html' import render_field, github_login %}

{% block body %}
<div class="login-title">
    <h1>Log in</h1>
    {{ github_login() }}
</div>
<div id="login-form">
    <form method='POST' action=''>
        {{ render_form(form, 'Log in!') }}
    </form>
</div>
<p>Don't have an account? <a href="{{ url_for('sign_up') }}">Sign up!</a></p>
{% endblock %}
