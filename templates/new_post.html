{% extends 'layout.html' %}
{% from 'macros.html' import render_field %}

{% block body %}
<h1>Posts:</h1>
<form method='POST' action=''>
    {{ form.hidden_tag() }}
    {% for field in form %}
    {{ render_field(field) }}
    {% endfor %}
    <button type="submit">Post!</button>
</form>
{% endblock %}
