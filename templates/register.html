{% extends 'layout.html' %}
{% from 'macros.html' import render_field %}

{% block body %}
<h1>Register</h1>
<form method="POST" action="{{ url_for('register') }}">
    {{ form.hidden_tag() }}
    {% for field in form %}
    {{ render_field(field) }}
    {% endfor %}
    <button type="submit">Register!</button>
</form>
{% endblock %}
